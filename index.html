<!doctype html>
<html lang="en" class="theme-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official website and social links for EHM Construction LLC.">
  <title>EHM Construction LLC | Official Links</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { margin: 0; background: #fcfcfc; color: #1b1919; font-family: system-ui, sans-serif; }
    .ehm-page { width: min(100% - 2rem, 26rem); margin: 0 auto; padding: 3rem 0; text-align: center; }
    h1 { font-size: clamp(1.5rem, 6vw, 2rem); margin: 1rem 0 1.5rem; }
    .ehm-logo { display: block; width: 100%; aspect-ratio: 2.25; object-fit: cover; object-position: center 42%; }
    .ehm-links { display: grid; gap: .75rem; }
    .ehm-links a { display: block; border: 1px solid #d8cece; border-radius: .625rem; padding: .875rem 1rem; background: #fff; color: #261d1d; font-weight: 650; text-decoration: none; }
    .ehm-links a:hover { border-color: #ad171d; }
    .ehm-links a:focus-visible { outline: 3px solid #ad171d; outline-offset: 3px; }
    .ehm-links a:first-child { border-color: #b4171d; background: #b4171d; color: #fff; }
    .ehm-links a:first-child:hover { background: #921219; }
  </style>
</head>
<body>
  <main class="ehm-page">
    <img class="ehm-logo" src="./ehm-logo.png" alt="" width="1024" height="1024">
    <h1>EHM Construction LLC</h1>
    <nav class="ehm-links" aria-label="Official business links">
      <a href="https://ehmconstructionllc.com/">Visit Our Website</a>
      <a href="https://share.google/HeEXAikND1FAa8eZr">Find Us on Google</a>
      <a href="https://www.facebook.com/share/15yrnmmM1c/">Facebook</a>
      <a href="https://www.instagram.com/ehmconstructionllc">Instagram</a>
      <a href="https://www.tiktok.com/@ehmconstructionllc">TikTok</a>
    </nav>
  </main>
</body>
</html>
